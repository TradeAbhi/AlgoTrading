# ============================================================
# Delta Exchange Alert Service Configuration
# ============================================================

delta:
  api:
    base-url: https://api.india.delta.exchange
    testnet: false
    testnet-url: https://testnet-api.delta.exchange
  symbols: BTCUSD,ETHUSD,SOLUSD,PAXGUSD
  crypto-consolidation:
    consolidation-days: 8
    max-range-pct: 5.0
    target-rr: 3
    scheduler:
      15m-check: "0 0/15 8-17 * * * *"
      daily-check: "0 0 0 * * *"

alert:
  scheduler:
    cron: "0 0/15 * * * *"
  pdl:
    refresh:
      cron: "0 1 0 * * *"
  cooldown:
    minutes: 15

daily-breakout:
  scheduler:
    alert:
      cron: "0 0/15 * * * *"    # Check every 15 minutes for 15m candle breakouts
    reference:
      refresh:
        cron: "0 1 0 * * *"      # Check daily candle for reference level update at 00:01 UTC
  cooldown:
    minutes: 15

volume:
  scanner:
    spike-multiplier: 2.0    # volume >= 2x avg  → spike
    climax-multiplier: 3.0   # volume >= 3x avg + trending → climax
portfolio:
  volume:
    scan:
      multiplier: 1.5        # volume >= 1.5x avg → alert for volume spike
      daily:
        lookback: 20         # number of daily candles for average
      weekly:
        lookback: 20         # number of weekly candles for average
      monthly:
        lookback: 20         # number of monthly candles for average
      min-history-days: 5    # minimum days of history required for new stocks
  price:
    movement:
      threshold: 2.5         # price change >= 2.5% from previous period → alert

logging:
  level:
    com.trading.algo.delta: DEBUG
    okhttp3: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


