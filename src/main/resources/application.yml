# ============================================================
# Trading Bot Configuration - ORB & Watchlist Modules
# ============================================================

orb:
  instruments-csv-path: classpath:ind_nifty500list.csv

backtest:
  requests-per-second: 20
  thread-pool-size: 10
  max-c2-range-percent: 1.41
  fixed-risk-rupees: 10000
  sl-margin-percent: 0.45
  min-c1-body-pct: 0.3      # Problem 4: C1 body >= 0.3% of open price
  min-candle-body-points: 0.5  # near-disabled — minC1BodyPct handles this relatively
  min-c1-atr-ratio: 0.5    # Problem 1: C1 range >= 0.5x 20-day ATR
  min-c1-volume-multiplier: 1.5  # Problem 2: C1 volume >= 1.5x 5-day avg 9:15 candle volume

watchlist:
  # Limits per category
  top-gainers-limit: 20
  top-losers-limit: 20
  active-by-value-limit: 20
  high-oi-limit: 20
  volume-shocker-limit: 20
  only-buyers-limit: 20
  only-sellers-limit: 20

  # Thresholds and Logic
  volume-shocker-threshold: 3.0    # 3x avg volume = shocker
  only-buyers-ratio-threshold: 5.0 # buyQty >= 5x sellQty
  only-sellers-ratio-threshold: 5.0 # sellQty >= 5x buyQty

  # Liquidity Filters
  min-traded-value-crores: 5.0
  min-open-interest: 100000
  cache-ttl-seconds: 60
  segment: NSE_EQ

# ============================================================
# Spring Framework Infrastructure
# ============================================================

spring:
  application:
    name: AlgoTrading
  devtools:
    restart:
      # Disable the restart classloader provided by Spring Boot DevTools.
      # This avoids classloading issues where the RestartClassLoader can't
      # find newly compiled application classes (NoClassDefFoundError).
      enabled: true

  cache:
    type: caffeine
    cache-names:
      - instruments
      - quotes

  caffeine:
    spec: maximumSize=500,expireAfterWrite=65s

  task:
    scheduling:
      pool:
        size: 5  # Shared pool for ORB and existing schedulers

  # ===============================
  # MYSQL CONFIG
  # ===============================
  datasource:
    url: jdbc:mysql://localhost:3306/algotrading
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true

# ============================================================
